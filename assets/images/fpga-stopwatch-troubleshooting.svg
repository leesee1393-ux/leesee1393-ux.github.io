<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="714" viewBox="0 0 1400 714">
<style>text{font-family:'Noto Sans KR',Arial,sans-serif;fill:#1d2935}.heading{font-size:40px;font-weight:700}.white{fill:#fff;font-size:26px;font-weight:700}.tag{font-size:22px;font-weight:700}.code{font-family:Consolas,monospace;font-size:19px;white-space:pre}.foot{font-size:20px}</style>
<rect width="1400" height="714" fill="#f9f8f5"/><text x="24" y="53" class="heading">Troubleshooting: FSM 및 시간 카운터</text>
<rect x="27" y="89" width="652" height="54" rx="6" fill="#19334b"/><rect x="709" y="89" width="652" height="54" rx="6" fill="#19334b"/>
<text x="47" y="125" class="white">01　 FSM Multi-Driver 오류</text><text x="729" y="125" class="white">02　 시간 카운터 설계 오류</text>
<rect x="27" y="165" width="652" height="170" rx="18" fill="#f0f2f4"/><rect x="709" y="165" width="652" height="170" rx="18" fill="#f0f2f4"/>
<rect x="27" y="358" width="652" height="193" rx="18" fill="#f0f2f4"/><rect x="709" y="358" width="652" height="193" rx="18" fill="#f0f2f4"/>
<text x="50" y="202" class="tag" fill="#a13d2d">수정 전</text><text x="733" y="202" class="tag">수정 전</text>
<text x="52" y="234" class="code">if (btn[0] &amp;&amp; !r_prev_btnL)</text><text x="93" y="262" class="code">r_mode = (r_mode == PAUSE) ?</text><text x="170" y="290" class="code">STOPWATCH : r_mode + 1;</text><text x="52" y="316" class="code">// 다른 always: r_mode &lt;= MIN_SEC;</text>
<text x="734" y="234" class="code">if (r_1s_counter == 6'd60-1) begin</text><text x="779" y="262" class="code">r_1s_counter &lt;= 0;</text><text x="779" y="290" class="code">r_1M_counter &lt;= r_1M_counter+1'b1;</text><text x="734" y="316" class="code">end</text>
<text x="50" y="394" class="tag" fill="#197455">수정 후</text><text x="733" y="394" class="tag" fill="#197455">수정 후</text>
<text x="52" y="430" class="code">if (w_btnL_press)</text><text x="93" y="458" class="code">r_stopwatch_mode &lt;= !r_stopwatch_mode;</text><text x="52" y="495" class="code">if (w_btnR_press &amp;&amp; r_stopwatch_mode)</text><text x="93" y="523" class="code">r_stopwatch_running &lt;= !r_stopwatch_running;</text>
<text x="734" y="430" class="code">wire w_second_tick =</text><text x="782" y="458" class="code">(r_tick_counter == CLK_FREQ - 1);</text><text x="734" y="495" class="code">if (w_second_tick) r_tick_counter &lt;= 0;</text><text x="734" y="523" class="code">else r_tick_counter &lt;= r_tick_counter + 1;</text>
<rect x="27" y="574" width="652" height="116" rx="14" fill="#fff" stroke="#ccd2d7"/><rect x="709" y="574" width="652" height="116" rx="14" fill="#fff" stroke="#ccd2d7"/>
<text x="48" y="611" class="foot">원인　|　r_mode를 둘 이상의 always 블록에서 할당</text><text x="48" y="645" class="foot">해결　|　mode/running을 단일 순차 블록에서 제어</text>
<text x="730" y="611" class="foot">원인　|　100MHz에서 60클록은 600ns에 불과</text><text x="730" y="645" class="foot">해결　|　CLK_FREQ 기준 1초 Tick 생성</text>
</svg>