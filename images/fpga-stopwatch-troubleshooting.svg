<svg xmlns="http://www.w3.org/2000/svg" width="1395" height="715" viewBox="0 0 1395 715"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#192e42}.title{font-size:40px;font-weight:bold}.h{font-size:28px;font-weight:bold;fill:#fff}.label{font-size:23px;font-weight:bold}.code{font-family:Consolas,monospace;font-size:19px;fill:#18212c}.note{font-size:19px}</style><rect width="1395" height="715" fill="#f8f6f2"/><text class="title" x="23" y="50">Troubleshooting: FSM 및 시간 카운터</text><text x="1341" y="34" font-size="18" font-weight="bold" fill="#64717b">13</text><rect x="27" y="89" width="652" height="55" rx="6" fill="#193148"/><rect x="709" y="89" width="652" height="55" rx="6" fill="#193148"/><text class="h" x="46" y="125">01  FSM Multi-Driver 오류</text><text class="h" x="729" y="125">02  시간 카운터 설계 오류</text><g fill="#edf1f4"><rect x="27" y="165" width="652" height="170" rx="18"/><rect x="709" y="165" width="652" height="170" rx="18"/><rect x="27" y="359" width="652" height="192" rx="18"/><rect x="709" y="359" width="652" height="192" rx="18"/></g><g fill="#b64335" font-size="23" font-weight="bold"><text x="49" y="198">수정 전</text><text x="731" y="198">수정 전</text></g><text class="code" x="52" y="235"><tspan>if (btn[0] &amp;&amp; !r_prev_btnL)</tspan><tspan x="52" dy="28">  r_mode = (r_mode == PAUSE) ?</tspan><tspan x="52" dy="28">    STOPWATCH : r_mode + 1;</tspan><tspan x="52" dy="28">// 다른 always: r_mode &lt;= MIN_SEC;</tspan></text><text class="code" x="734" y="235"><tspan>if (r_1s_counter == 6'd60-1) begin</tspan><tspan x="734" dy="28">  r_1s_counter &lt;= 0;</tspan><tspan x="734" dy="28">  r_1M_counter &lt;= r_1M_counter+1'b1;</tspan><tspan x="734" dy="28">end</tspan></text><g fill="#097053" font-size="23" font-weight="bold"><text x="49" y="391">수정 후</text><text x="731" y="391">수정 후</text></g><text class="code" x="52" y="427"><tspan>if (w_btnL_press)</tspan><tspan x="52" dy="28">  r_stopwatch_mode &lt;= !r_stopwatch_mode;</tspan><tspan x="52" dy="28">if (w_btnR_press &amp;&amp; r_stopwatch_mode)</tspan><tspan x="52" dy="28">  r_stopwatch_running &lt;= !r_stopwatch_running;</tspan></text><text class="code" x="734" y="427"><tspan>wire w_second_tick =</tspan><tspan x="734" dy="28">  (r_tick_counter == CLK_FREQ - 1);</tspan><tspan x="734" dy="28">if (w_second_tick) r_tick_counter &lt;= 0;</tspan><tspan x="734" dy="28">else r_tick_counter &lt;= r_tick_counter + 1;</tspan></text><g fill="#fff" stroke="#cdd7df"><rect x="27" y="573" width="652" height="118" rx="12"/><rect x="709" y="573" width="652" height="118" rx="12"/></g><text class="note" x="47" y="611"><tspan>원인  |  r_mode를 둘 이상의 always 블록에서 할당</tspan><tspan x="47" dy="30">해결  |  mode/running을 단일 순차 블록에서 제어</tspan></text><text class="note" x="729" y="611"><tspan>원인  |  100MHz에서 60클록은 600ns에 불과</tspan><tspan x="729" dy="30">해결  |  CLK_FREQ 기준 1초 Tick 생성</tspan></text></svg>