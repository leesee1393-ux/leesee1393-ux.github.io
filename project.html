.small-card-content{display:flex;flex-direction:column;padding:24px 22px;min-width:0}.small-card .card-eyebrow{font-size:10px}.small-card h3{font:700 21px/1.45 var(--serif);letter-spacing:-.045em;margin:11px 0}

.project-main{min-height:75vh}.breadcrumbs{padding:35px 0 0;font:12px var(--mono);color:#86796b;display:flex;gap:12px;flex-wrap:wrap}.breadcrumbs a{text-decoration:underline;text-underline-offset:4px}

.bottom-cta{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:62px 0 110px}.bottom-cta p{font:11px var(--mono);color:var(--accent);margin:0 0 8px}.bottom-cta a.next-link{font:700 23px/1.5 var(--serif)}.error-state{padding:130px 0 200px}.error-state h1{font:700 38px var(--serif)}

and .section-head{align-items:start;flex-direction:column}.archive-item{grid-template-columns:27px 1fr 20px;gap:10px}.about-section h2{font-size:27px}.about-copy p{font-size:14px}.footer-inner{align-items:start;flex-direction:column}.detail-figure{height:270px}.project-hero{padding-top:42px;padding-bottom:34px}.project-hero h1{font-size:32px}.project-intro{font-size:17px}.detail-cols{grid-template-columns:1fr;gap:30px;padding:47px 0}.detail-cols h2,.detail-sections h2{font-size:23px}.detail-points{grid-template-columns:1fr}.detail-section{padding:37px 0}.bottom-cta{align-items:flex-start;flex-direction:column;padding:45px 0 65px}.bottom-cta .btn{width:100%}}

/* Progressive image display: the engineering-paper placeholder stays visible until
   a genuine repository image is loaded, preventing empty image regions. */
.hero-photo .photo-fallback{display:flex;position:absolute;top:12px;left:12px;right:12px;height:340px;min-height:0;z-index:0}
.hero-photo img{position:relative;z-index:1}
.media .photo-fallback{display:flex;position:absolute;inset:0;z-index:0;background:
  linear-gradient(90deg,transparent calc(50% - .5px),rgba(96,73,46,.13) 50%,transparent calc(50% + .5px)),
  linear-gradient(transparent calc(50% - .5px),rgba(96,73,46,.13) 50%,transparent calc(50% + .5px)),
  linear-gradient(120deg,#dccfb9,#eee4d6)}
.media img{position:absolute;inset:0;z-index:1}
.media.image-missing img{display:none}
@media(max-width:860px){.hero-photo .photo-fallback{height:340px}}
@media(max-width:650px){.hero-photo .photo-fallback{height:235px}}

.hero-photo img,.media img{opacity:0}
.hero-photo.image-loaded img,.media.image-loaded img{opacity:1}
.photo-frame,.media{isolation:isolate}
.hero-photo .photo-fallback,.media .photo-fallback{z-index:1}
.hero-photo img,.media img{z-index:2}
.media .media-number{z-index:3}


/* Shared detailed engineering notes for project troubleshooting */
.extra-trouble{margin:28px 0 8px;border:1px solid var(--line);background:var(--paper);box-shadow:0 10px 24px rgba(55,45,34,.045)}
.extra-trouble-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:15px 23px;background:var(--sand);border-bottom:1px solid var(--line);font:500 12px/1.5 var(--mono);color:var(--accent);letter-spacing:.04em}
.extra-trouble-header a{text-decoration:underline;text-underline-offset:4px;font-weight:600}
.extra-trouble-body{padding:26px clamp(18px,3.5vw,36px) 34px}
.extra-trouble-body h3{font:700 24px/1.55 var(--serif);margin:0 0 20px;color:var(--ink)}
.extra-trouble-body h4{font-size:18px;line-height:1.6;color:var(--ink);margin:28px 0 12px}
.vision-note h4{padding-left:12px;border-left:3px solid var(--accent)}
.extra-trouble-body p{line-height:1.93;margin:11px 0;color:var(--sub)}
.extra-trouble-body ul,.extra-trouble-body ol{padding-left:25px;line-height:1.95;margin:12px 0 20px}
.extra-trouble-body li{padding-left:4px;margin:5px 0}
.extra-trouble-diagram{margin:24px 0;background:#f6f2eb;border:1px solid var(--line);padding:11px}
.extra-trouble-diagram img{display:block;width:100%;height:auto}
.extra-trouble-diagram figcaption{font-size:12px;line-height:1.6;color:var(--quiet);padding:9px 4px 3px}
.extra-trouble-cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:26px 0}
.extra-trouble-cases article{padding:20px 21px;background:#f8f4ed;border:1px solid var(--line);min-width:0}
.extra-trouble-cases .case-number{font:500 11px/1.5 var(--mono);color:var(--accent);letter-spacing:.04em}
.extra-trouble-cases h4{margin:10px 0 11px;font-size:18px}
.extra-trouble-cases p{margin:8px 0;font-size:14px}
.trouble-takeaway{padding:18px 20px;background:#eee6da;border-left:3px solid var(--accent)}
@media(max-width:700px){.extra-trouble-cases{grid-template-columns:1fr}.extra-trouble-body{padding:19px 16px 25px}.extra-trouble-header{padding:13px 16px}}

.extra-trouble-diagram.original-evidence img{width:100%;height:auto;display:block}
.extra-trouble-diagram.original-evidence figcaption a{font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
</style>

    ${p.id === "fpga-spi" ? "<section class=\"detail-section\" data-mark=\"fpga-spi-flow-anchor\"><p class=\"eyebrow\">PROJECT DIAGRAMS</p><h2>SPI Master–Slave 시스템 · 배선 흐름도</h2><figure style=\"margin:20px 0;border:1px solid var(--line);padding:12px;background:var(--paper)\"><a href=\"images/fpga-spi-wiring-clean.svg\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"images/fpga-spi-wiring-clean.svg\" alt=\"두 Basys3의 SPI Master JA와 Slave JC 연결 신호 및 센서 주소 맵\" style=\"display:block;width:100%;height:auto\" loading=\"lazy\"></a><figcaption>SCK · MOSI · MISO · CS_n · 공통 GND, 센서 주소 맵</figcaption></figure><h2>Slave의 센서 수집</h2><figure style=\"margin:20px 0;border:1px solid var(--line);padding:12px;background:var(--paper)\"><img src=\"https://raw.githubusercontent.com/leesee1393-ux/FPGA-SPI-microwave-temperature-and-humidity/main/sim/sensor_fsm_preview/06_Sensor_FSM.png\" alt=\"DHT11·HC-SR04 센서 FSM\" style=\"display:block;width:100%;height:auto\" loading=\"lazy\"><figcaption>DHT11 및 HC-SR04 센서 제어 FSM</figcaption></figure></section>" : ""}
    <section class="detail-section"><p class="eyebrow">04 / TROUBLESHOOTING · NOTES</p><h2>문제 해결 및 기록</h2>${p.id === "fpga-stopwatch" ? '<figure style="margin:20px 0 25px;border:1px solid var(--line);background:var(--paper);padding:12px"><img src="images/fpga-stopwatch-troubleshooting.svg" alt="FSM Multi-Driver 및 시간 카운터 설계 오류: 수정 전후 코드와 원인·해결 비교" style="display:block;width:100%;height:auto" loading="lazy"><figcaption style="font-size:12px;color:var(--quiet);margin-top:10px">FSM 및 시간 카운터 오류의 원인과 수정 전후 비교</figcaption></figure>' : ""}<p>${escape(p.problem).replace(/\n\n/g, '</p><p>')}</p>${p.id === "vision-tracker" ? "<div class=\"extra-trouble vision-note\"><div class=\"extra-trouble-header\"><span>FIELD NOTE / PAN·TILT CONTROL</span><a href=\"https://github.com/Vision-Tracker-Project/Vision_Tracker_Project/blob/main/NOTION_TROUBLESHOOTING/06_%ED%8C%AC%ED%8B%B8%ED%8A%B8_%EC%A7%84%EB%8F%99_%EC%96%B5%EC%A0%9C%EC%99%80_%EC%96%BC%EA%B5%B4_%EB%B0%A9%ED%96%A5_%EC%A0%9C%EC%96%B4.md\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 원문 보기 ↗</a></div><div class=\"extra-trouble-body\"><h3>인물 박스와 Pose 흔들림으로 인한 팬·틸트 진동 억제</h3><h4>초기 문제</h4><p>처음에는 추적 기준점을 다음 순서로 선택했다.</p><ol><li>두 어깨의 중간점</li><li>두 골반의 중간점</li><li>인물 박스 중앙</li></ol><p>Pose 키포인트 신뢰도가 임계값 근처에서 바뀌면 기준점이 어깨·골반·박스 중앙 사이를 오갔다. 사람이 가만히 있어도 빨간 십자선이 크게 이동했고 카메라가 이를 따라 진동했다.</p><p>인물 박스 중앙만 사용하는 방법도 검토했지만, 검출 박스 자체가 매 프레임 흔들리기 때문에 중앙점도 계속 움직였다.</p><h4>안전 영역 제어</h4><p>사람을 항상 화면 정중앙에 맞추는 대신, 인물 박스를 화면 안의 안전 영역에 유지하는 방식으로 변경했다.</p><ul><li>최근 3개 인물 박스의 중앙값 사용</li><li>팬 이동 시작: 박스가 화면 좌우 22% 경계를 넘을 때</li><li>팬 이동 종료: 박스가 좌우 30% 안쪽으로 복귀할 때</li><li>팬 방향 판단: 2프레임 연속 경계 초과</li><li>박스가 양쪽 경계를 동시에 넘을 정도로 크면 해당 축을 움직이지 않음</li></ul><p>시작 경계와 종료 경계를 다르게 둬 경계 주변에서 서보가 반복해서 켜지고 꺼지는 현상을 줄였다.</p><h4>명령 누적으로 인한 좌우 진동</h4><p>AI는 약 25 FPS로 동작하지만 UART는 0.1초마다 전송했다. 과거에는 매 AI 프레임에서 각도를 변경해 전송 사이에 2~3번의 각도 변화가 누적될 수 있었다. 한 프레임당 최대 4도라면 실제 서보에는 한 번에 8~12도 변화가 전달돼 목표 영역을 지나칠 수 있었다.</p><p>다음과 같이 수정했다.</p><ul><li>각도 계산도 실제 UART 전송 가능 시점에만 한 번 수행</li><li>한 번의 최대 각도 이동: 2도</li><li>안전 영역 복귀 또는 방향 전환 후 정착 시간: 300ms</li><li>UART가 연결되지 않았을 때 내부 각도 누적 금지</li></ul><p>경계 확인 프레임 수를 무조건 늘리는 방법은 출발을 늦출 뿐, 움직이기 시작한 뒤의 오버슈트를 해결하지 못한다. 명령 주기와 각도 계산 주기를 맞추는 것이 핵심이다.</p><h4>틸트의 얼굴 방향 제어</h4><p>전신 박스 중앙을 틸트 목표로 사용하면 카메라가 사람의 배나 골반을 향해 시연성이 떨어졌다. 별도의 얼굴 모델을 추가하지 않고 인물 박스 높이로 얼굴 위치를 추정하도록 변경했다.</p><ul><li>추정 얼굴 위치: 인물 박스 상단에서 전체 높이의 약 10% 지점</li><li>틸트 이동 시작: 추정 얼굴이 화면 높이의 22~42% 범위를 벗어남</li><li>틸트 이동 종료: 추정 얼굴이 화면 높이의 28~36%에 들어옴</li><li>틸트 방향 판단: 3프레임 연속 범위 초과</li></ul><p>빨간 십자선은 안정화된 추정 얼굴 위치를 표시한다. 팬 제어는 인물 박스 좌우 경계를 사용하고, 틸트 제어는 추정 얼굴의 화면상 높이를 사용한다.</p><h4>주요 조정값</h4><p>환경에 맞춰 다음 값을 조정한다.</p><ul><li>팬이 너무 늦게 반응함: 팬 시작 경계를 더 안쪽으로 이동</li><li>팬이 순간적인 박스 튐에 반응함: 팬 확인 프레임 증가</li><li>카메라가 목표를 지나침: 최대 이동 각도 또는 gain 감소</li><li>방향 전환 후 진동함: 정착 시간 증가</li><li>얼굴이 화면에서 너무 높거나 낮음: 얼굴 복귀 범위 조정</li><li>추정 얼굴점이 부정확함: 인물 박스 높이 대비 얼굴 비율 조정</li></ul></div></div>" : ""}${p.id === "linux-fan" ? "<div class=\"extra-trouble linux-fan-note\">\n<div class=\"extra-trouble-header\"><span>FIELD NOTE / SYSTEM INTEGRATION</span><a href=\"https://github.com/twotwoship/Linux_fan\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub 프로젝트 보기 ↗</a></div>\n<div class=\"extra-trouble-body\">\n<h3>핀·전원·타이밍과 모듈 간 데이터 규약을 맞춘 통합 디버깅</h3>\n<p>Jetson Orin Nano에 모터, 로터리 엔코더, BMP180, LCD, FND, LED Bar를 연결하면서 개별 모듈 테스트와 전체 애플리케이션 통합 실행의 동작이 다르게 나타났습니다. 모터 드라이버·FND 타이머 드라이버 담당으로 PWM 출력, 장치 파일 연동, 타이머 로직을 점검하고, 다른 장치의 담당 팀원들과 입력·전원·상태값 인터페이스를 함께 확인했습니다.</p>\n<figure class=\"extra-trouble-diagram original-evidence\"><a href=\"images/linux-fan-troubleshooting-original.webp\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"트러블슈팅 원본 이미지 크게 보기\"><img loading=\"lazy\" src=\"images/linux-fan-troubleshooting-original.webp\" alt=\"Linux Smart Fan 실제 통합 디버깅 발표 이미지: 엔코더 입력 파형, LCD I2C 출력, 타이머 로그, LED Duty 매핑 코드\"></a><figcaption>실제 통합 디버깅 자료 — 엔코더 신호, LCD·I²C, 타이머 동작, Duty·LED 단계 매핑을 파형·로그·코드와 함께 정리했습니다. <a href=\"images/linux-fan-troubleshooting-original.webp\" target=\"_blank\" rel=\"noopener noreferrer\">원본 이미지 크게 보기 ↗</a></figcaption></figure>\n<div class=\"extra-trouble-cases\">\n<article><span class=\"case-number\">01 / GPIO SIGNAL</span><h4>엔코더 입력 이상</h4><p><strong>증상</strong> 로터리 엔코더의 방향·입력 판단이 기대와 다르게 동작했습니다.</p><p><strong>분석·조치</strong> 입력 전압과 S1/S2 파형을 오실로스코프로 확인하고, 입력 극성이 제어 로직과 맞도록 NPN 반전 회로를 추가했습니다.</p></article>\n<article><span class=\"case-number\">02 / POWER · I²C</span><h4>LCD·I²C 출력 영향</h4><p><strong>증상</strong> 통합 연결 상태에서 LCD 표시 및 I²C 관련 동작에 문제가 나타났습니다.</p><p><strong>분석·조치</strong> 장치별 전원 공급 조건을 재점검하고 외부 전원을 사용하면서 각 모듈이 공통 GND를 공유하는지 확인했습니다.</p></article>\n<article><span class=\"case-number\">03 / TIMER · APPLICATION</span><h4>통합 실행 시 타이머 미동작</h4><p><strong>증상</strong> 개별 장치 테스트와 달리 통합 애플리케이션에서 카운트다운 또는 타이머 종료 처리가 기대대로 수행되지 않았습니다.</p><p><strong>분석·조치</strong> 타이머 종료 조건과 모드 범위 비교식을 점검하고, 남은 시간·상태값을 로그로 추적하여 조건 분기를 재검토했습니다.</p></article>\n<article><span class=\"case-number\">04 / SHARED SYMBOLS</span><h4>팬 Duty와 LED 표시 단계 불일치</h4><p><strong>증상</strong> 팬 속도 단계와 LED Bar에 전달되는 표시 단계가 일치하지 않았습니다.</p><p><strong>분석·조치</strong> 모듈에서 공유하는 Duty 정의와 LED 개수 변환 함수를 비교하고, OFF/70/80/90/100%를 각각 0/1/3/5/7개 LED에 대응하도록 값 매핑을 정리했습니다.</p></article>\n</div>\n<p class=\"trouble-takeaway\"><strong>배운 점</strong> Linux 디바이스 드라이버 통합에서는 단일 모듈의 정상 동작만으로 시스템 동작을 보장할 수 없습니다. GPIO 신호 극성, 전원·GND, 타이머 상태 전이, 공유 상수의 의미를 모듈 사이에서 일치시키는 검증이 중요하다는 점을 확인했습니다.</p>\n</div></div>" : ""}</section>
