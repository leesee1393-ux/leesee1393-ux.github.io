    "flow": "Project → Engineering Note → GitHub Pages",
    "responsibilities": [
      "프로젝트별 구현 범위와 원본 링크 정리",
      "간결한 메인 화면과 프로젝트 상세 페이지 구성"
    ],
    "implementation": [
      "각 프로젝트의 개요, 기여, 기술 스택, 주요 구현 내용을 보여줍니다."
    ],
    "problem": "원격 GitHub 이미지가 로드되지 않을 때 프로젝트 카드가 비어 보이지 않도록 onerror 기반 대체 도식·텍스트를 구성했습니다. 메인·상세 페이지가 각각 프로젝트 데이터를 포함하므로 새 프로젝트 추가 시 ID·링크·내용을 함께 갱신해야 합니다.",
    "video": null
  }
];

</script><script>
(() => {
  'use strict';
  const projects = window.PORTFOLIO_PROJECTS || [];
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const url = p => `project.html?id=${encodeURIComponent(p.id)}`;
  const github = p => `https://github.com/${p.repo}`;
  const tags = p => `<div class="stack">${p.stack.map(s=>`<span>${escape(s)}</span>`).join('')}</div>`;
  const media = (p, n, cls='') => `<figure class="media ${p.image ? 'has-photo' : ''} ${p.imageFit === 'contain' ? 'fit-contain' : ''} ${cls}">
    <span class="media-number">${String(n).padStart(2,'0')} / PROJECT</span>
    ${p.image ? `<img src="${escape(p.image)}" alt="${escape(p.imageAlt)}" loading="lazy" onload="this.parentElement.classList.add('image-loaded')" onerror="this.parentElement.classList.add('image-missing')">` : ''}
    <div class="photo-fallback" aria-hidden="true"><span class="fallback-icon">${escape(p.id === 'linux-fan' ? 'FAN' : p.id === 'vision-tracker' ? 'RC' : p.id === 'fpga-stopwatch' ? 'FPGA' : p.id === 'fpga-microwave' ? 'FPGA' : p.id === 'stm32-motor' ? 'UART' : p.id === 'avr-rtc' ? 'LCD' : 'DEV')}</span><span>${escape(p.signal)}</span></div>
  </figure>`;
  const actions = p => `<div class="card-actions"><a class="detail-link" href="${url(p)}">프로젝트 자세히 보기 ↗</a><a class="github-link" href="${github(p)}" target="_blank" rel="noopener noreferrer">GitHub 코드 ↗</a></div>`;
  function renderHome(){
    const featured = document.getElementById('featured-projects');
    if(!featured) return;
    const big = projects.filter(p=>p.kind==='featured');
    const small = projects.filter(p=>p.kind==='standard');
    const archive = projects.filter(p=>p.kind==='archive');
    featured.innerHTML = big.map((p,i)=>`<article class="feature-card">${media(p,i+1)}<div class="feature-card-content"><div class="card-eyebrow"><span>${escape(p.label)}</span><span>${escape(p.type)}</span></div><h3>${escape(p.title)}</h3><p class="card-summary">${escape(p.summary)}</p><p class="role-line">${escape(p.role)}</p>${tags(p)}${actions(p)}</div></article>`).join('');
    document.getElementById('other-projects').innerHTML=small.map((p,i)=>`<article class="small-card">${media(p,i+3)}<div class="small-card-content"><div class="card-eyebrow"><span>${escape(p.label)}</span></div><h3>${escape(p.title)}</h3><p class="card-summary">${escape(p.summary)}</p><p class="role-line">${escape(p.role)}</p>${tags(p)}${actions(p)}</div></article>`).join('');
    document.getElementById('archive-list').innerHTML=archive.map((p,i)=>`<article class="archive-item"><span class="archive-no">${String(i+7).padStart(2,'0')}</span><div><h3><a href="${url(p)}">${escape(p.title)}</a></h3><p>${escape(p.summary)}</p></div><a class="archive-open" href="${url(p)}" aria-label="${escape(p.title)} 상세 보기">↗</a></article>`).join('');
    const toggle=document.querySelector('.nav-toggle');
    const nav=document.getElementById('site-nav');
    if(toggle && nav){toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));nav.classList.toggle('open',!open)});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nav.classList.remove('open');toggle.setAttribute('aria-expanded','false')}));}
  }
  function renderDetail(){
    const root = document.getElementById('project-detail');
    if(!root) return;
    const id = new URLSearchParams(window.location.search).get('id');
    const p = projects.find(p=>p.id===id);
    if(!p){document.title='프로젝트를 찾을 수 없습니다 | 이세형';root.innerHTML='<section class="error-state"><p class="eyebrow">404 / NOT FOUND</p><h1>프로젝트를 찾을 수 없습니다.</h1><p>프로젝트 목록에서 다시 선택해 주세요.</p><a class="btn btn-primary" href="index.html#projects">프로젝트 목록 보기 ↗</a></section>';return;}
    const next=projects[(projects.indexOf(p)+1)%projects.length];
    document.title = `${p.title} | SEHYUNG LEE`;
    document.querySelector('meta[name="description"]').setAttribute('content',p.summary);
    root.innerHTML=`<div class="breadcrumbs"><a href="index.html">Home</a><span>/</span><a href="index.html#projects">Projects</a><span>/</span><span>${escape(p.title)}</span></div>
    <article><header class="project-hero"><p class="eyebrow">PROJECT NOTE / ${escape(p.label)} · ${escape(p.status)}</p><h1>${escape(p.title)}</h1><p class="repo-path">github.com/${escape(p.repo)}</p><p class="project-intro">${escape(p.summary)}</p>${tags(p)}<div class="card-actions"><a class="btn btn-primary" href="${github(p)}" target="_blank" rel="noopener noreferrer">GitHub 원본 코드 보기 ↗</a>${p.video?`<a class="btn btn-quiet" href="${escape(p.video)}" target="_blank" rel="noopener noreferrer">시연 영상 보기 ↗</a>`:''}<a class="btn btn-quiet" href="index.html#projects">← 목록으로</a></div></header>
    ${media(p,projects.indexOf(p)+1,'detail-figure')}
    <div class="detail-cols"><section><p class="eyebrow">01 / OVERVIEW</p><h2>어떤 프로젝트인가요?</h2><p>${escape(p.overview)}</p></section><aside class="role-panel"><h3>내가 담당한 부분</h3><p>${escape(p.role)}</p><div class="role-meta"><span>SOURCE REPOSITORY</span><strong>${escape(p.repo)}</strong></div><div class="role-meta"><span>STATUS</span><strong>${escape(p.status)}</strong></div></aside></div>
    <section class="detail-sections"><p class="eyebrow">02 / IMPLEMENTATION</p><h2>구현 · 학습 항목</h2><ol class="detail-points">${p.responsibilities.map((s,i)=>`<li><span class="point-no">${String(i+1).padStart(2,'0')}</span><p>${escape(s)}</p></li>`).join('')}</ol></section>
    <section class="detail-section"><p class="eyebrow">03 / SYSTEM FLOW</p><h2>동작 흐름</h2><div class="flow-text">${escape(p.flow)}</div><p>${p.implementation.map(escape).join(' ')}</p></section>
    <section class="detail-section">${p.id === "fpga-microwave" ? '<p class="eyebrow">PROJECT DIAGRAMS</p><h2>FSM · Top Level 회로도</h2><figure style="margin:22px 0;border:1px solid var(--line);padding:12px;background:var(--paper)"><img src="https://raw.githubusercontent.com/leesee1393-ux/FPGA-Microwave-Oven-Controller/main/docs/images/fsm_diagram.svg" alt="전자레인지 동작 흐름 및 상태 전이 개념도" style="display:block;width:100%;height:auto" loading="lazy"><figcaption>FSM / 동작 흐름 개념도</figcaption></figure><figure style="margin:22px 0;border:1px solid var(--line);padding:12px;background:var(--paper)"><img src="images/fpga-microwave-top-level.svg" alt="FPGA 전자레인지 Top level 모듈 연결 개요" style="display:block;width:100%;height:auto" loading="lazy"><figcaption>Top level 모듈 연결 개요 (제공된 Vivado 화면 기반 재작성)</figcaption></figure>' : ""}</section>
    <section class="detail-section"><p class="eyebrow">04 / TROUBLESHOOTING · NOTES</p><h2>문제 해결 및 기록</h2>${p.id === "fpga-stopwatch" ? '<figure style="margin:20px 0 25px;border:1px solid var(--line);background:var(--paper);padding:12px"><img src="images/fpga-stopwatch-troubleshooting.svg" alt="FSM Multi-Driver 및 시간 카운터 설계 오류: 수정 전후 코드와 원인·해결 비교" style="display:block;width:100%;height:auto" loading="lazy"><figcaption style="font-size:12px;color:var(--quiet);margin-top:10px">FSM 및 시간 카운터 오류의 원인과 수정 전후 비교</figcaption></figure>' : ""}<p>${escape(p.problem).replace(/\n\n/g, '</p><p>')}</p></section>
    <div class="bottom-cta"><div><p>NEXT PROJECT / FIELD NOTES</p><a class="next-link" href="${url(next)}">${escape(next.title)} ↗</a></div><a class="btn btn-quiet" href="index.html#projects">전체 프로젝트로 돌아가기 ↗</a></div></article>`;
  }
  renderHome();
  renderDetail();
})();

</script>
</body>
</html>
